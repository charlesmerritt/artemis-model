name: CI

on:
  # `pull_request` covers every branch that matters; a blanket push trigger
  # would fire a second, identical run for each commit on a branch with an
  # open PR. Push is scoped to main so post-merge state is still verified.
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref: only the newest commit's result
# is meaningful, and the rest are wasted runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a cap, a hung `uv sync` or stalled test runs to GitHub's 6-hour
    # default. This suite takes well under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # .python-version pins 3.14; pyproject requires >=3.14.
      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # tests/ was removed on 2026-09-14 in favour of executable documentation: the rules
      # are checks, the usage examples are doctests, and both run here.
      - name: Conventions
        run: uv run python scripts/check_conventions.py

      - name: Documentation (doctests, references, markdown budget)
        run: uv run python scripts/check_docs.py

      # tests/ is being rebuilt incrementally; pytest also runs the doctests in pipeline/.
      # CRAP and mutation reports run in quality.yml.
      - name: Tests
        run: uv run pytest -q

# Scope notes
#
# Lint config lives in pyproject.toml [tool.ruff]: ruff's default rules (E4/E7/E9
# + F -- correctness and unused code, no style churn), notebooks excluded because
# their mid-file imports and semicolons are normal cell style, not defects.
#
# NOT covered, deliberately: FVS itself. FVS is a Windows DLL on the workstation (and a
# locally compiled FVSsn elsewhere); this runner has neither it nor the /mnt/d drive or
# the R2 credentials, so nothing here touches project data.
