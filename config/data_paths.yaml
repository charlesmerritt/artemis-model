# Data paths — environment-specific, not committed if paths differ across machines
# All paths point to /mnt/d/ (external drive, present on local workstation)
# When promoting to HPC, copy this file and update paths to the HPC data mount.
# All downstream pipeline code reads paths from here — no hardcoded /mnt/d/ in scripts.
#
# Alternative source — Cloudflare R2
# ----------------------------------
# The bucket `artemis-r2` holds the same data under its `data/` prefix, so
#
#     /mnt/d/<path>   ==   r2:artemis-r2/data/<path>
#
# for every entry below unless a per-key comment says otherwise (see the FVS
# project copy at the bottom, whose bucket name differs). Use R2 wherever the
# drive is not mounted — cloud sandbox, CI runner, second workstation.
#
# rclone reads its credentials from the preconfigured RCLONE_CONFIG_R2_*
# environment variables (type, provider, endpoint, access key, secret), so no
# rclone.conf is required and no credentials belong in this file. Verified
# 2026-07-30 with rclone v1.60.1:
#
#     rclone lsf   r2:artemis-r2/data/TreeMap-2022/Data/        # list one directory
#     rclone size  r2:artemis-r2/data/TreeMap_Chaz/output2020   # check before pulling a tree
#     rclone copyto \
#       r2:artemis-r2/data/Harvest_level_guidance_from_TPO_reports_1999-2024.xlsx \
#       data/raw/Harvest_level_guidance_from_TPO_reports_1999-2024.xlsx
#     rclone copy  r2:artemis-r2/data/<dir> /mnt/d/<dir>        # whole directory
#
# Prefer fetching individual files: several of these directories are ~1 GiB
# (`TreeMap_Chaz/output2020` is 1.01 GiB over 11 objects) and the raw TreeMap and
# FIA trees are far larger.
#
# Two things to know. The token is scoped to the bucket, so a bare `rclone lsd r2:`
# returns 403 — always name `artemis-r2`. And pipeline code still opens the /mnt/d
# paths directly, so fetch a file to its declared path before running; only callers
# that go through pipeline/data_access.py get the fallback for free.
#
# data/index.md catalogs every folder in the bucket — size, contents, and which
# config key (if any) points at it.

drive: "/mnt/d"

# Object-storage mirror of `drive`. `<remote>:<bucket>/<prefix>/X` holds `<drive>/X`.
# Read by pipeline/data_access.py, which resolves a declared path against the
# drive first and this bucket second.
r2:
  remote:       "r2"            # rclone remote, configured from RCLONE_CONFIG_R2_* env vars
  bucket:       "artemis-r2"
  prefix:       "data"
  endpoint_env: "RCLONE_CONFIG_R2_ENDPOINT"   # account-scoped URL; read from the env, not Git

  # The bucket also mirrors this repo's gitignored data/ tree (pipeline interim and
  # processed outputs) under this prefix: <repo>/data/X is <prefix>/Artemis_data/X.
  repo_data_prefix: "Artemis_data"

  # Directories uploaded under a name other than their name on the drive.
  renames:
    Artemis_project_fvs_copy: "Artemis_project_fvs_copy_no_management"

raw:
  treemap_2022:
    tif:        "/mnt/d/TreeMap-2022/Data/TreeMap2022_CONUS.tif"
    tree_table: "/mnt/d/TreeMap-2022/Data/TreeMap2022_CONUS_Tree_Table.csv"
    data_dict:  "/mnt/d/TreeMap-2022/Data/TreeMap2022_CONUS_Data_Dictionary.pdf"
    var_desc:   "/mnt/d/TreeMap-2022/Data/_variable_descriptions.csv"

  ownership:
    tif:        "/mnt/d/RDS-2025-0045/Data/US_forest_ownership.tif"

  fia_sqlite:
    db:         "/mnt/d/SQLite_FIADB_ENTIRE/SQLite_FIADB_ENTIRE.db"
    # FVS-Ready tables present in this DB (no FIA2FVS conversion needed):
    #   FVS_TREEINIT_PLOT  — tree list records keyed to plot
    #   FVS_TREEINIT_COND  — tree list records keyed to condition
    #   FVS_STANDINIT_PLOT — stand initialization keyed to plot
    #   FVS_STANDINIT_COND — stand initialization keyed to condition
    #   FVS_PLOTINIT_PLOT  — plot-level initialization
    #   FVS_GROUPADDFILESANDKEYWORDS — keyword group assignments

  landfire:
    # Existing Vegetation Type
    evt_tif:    "/mnt/d/LF2022_EVT_CONUS/LF2022_EVT_CONUS/Tif/LF2022_EVT_CONUS.tif"
    # Vegatation Condition Class
    vcc_tif:    "/mnt/d/LF2022_VCC_CONUS/LF2022_VCC_CONUS/Tif/LF2022_VCC_CONUS.tif"

  nhd:
    fl_gdb:     "/mnt/d/US SE Streams - FINAL/US SE Streams - FINAL/Streams By State/nhdplus_epasnapshot2022_fl.gdb"
    se_gdb:     "/mnt/d/US SE Waterbodies Final/US SE Streams 10.20.2023/US SE Streams/US SE Streams.gdb"
    # Source: EPA NHDPlus snapshot 2022, state-level GDBs

  parcels:
    fl_all:     "/mnt/d/All_FL_Parcels"
    fl_5co:     "/mnt/d/FL_5_Co_Parcels.gdb"

  usfs_admin:
    gdb:        "/mnt/d/BdyAdm_LSRS_AdministrativeForest.gdb"

  roads:
    se_gdb:     "/mnt/d/SE_rds100k"

  counties:
    p010g_shp:  "/mnt/d/county_p010g.shp_nt00934/countyp010g.shp"

  states:
    # Census TIGER 2022 state boundaries; the notebooks select Florida (STATEFP 12).
    # Shapefile — resolve the directory, not the .shp, so the sidecars come with it.
    tl_2022_dir: "/mnt/d/tl_2022_us_state"
    tl_2022_shp: "/mnt/d/tl_2022_us_state/tl_2022_us_state.shp"

  tpo_guidance:
    # Source workbook for pipeline/s3_management/tpo_targets.py — harvest volume
    # targets from USFS TPO reports. Sits at the drive root; when pulled from R2
    # it is staged into the repo's gitignored data/raw/.
    xlsx:       "/mnt/d/Harvest_level_guidance_from_TPO_reports_1999-2024.xlsx"

  
  # GEE-only datasets 
  # lcms:       GEE asset  projects/lcms-292214/assets/CONUS/LCMS_CONUS_v2024-10
  # polaris:    GEE asset  projects/sat-io/open-datasets/POLARIS/
  # dem_3dep:   GEE asset  USGS/3DEP/1_3_arc_second_or_10m
  # prism:      GEE asset  OREGONSTATE/PRISM/Norm91m

  ecoregions:
    us_eco_l3_shp: "/mnt/d/us_eco_l3/us_eco_l3.shp"
    us_eco_l3_state_boundaries_shp: "/mnt/d/us_eco_l3_state_boundaries/us_eco_l3_state_boundaries.shp"
    us_eco_l4_shp: "/mnt/d/us_eco_l4/us_eco_l4.shp"
    us_eco_l4_state_boundaries_shp: "/mnt/d/us_eco_l4_state_boundaries/us_eco_l4_state_boundaries.shp"

  Artemis_project_fvs_copy_no_management:
    # For outputs of FVS run from the Windows GUI, the only working interface with FVS so far.
    # Open with duckdb, summary csvs created 'fvs_trajectory.csv', 'fvs_stand_change.csv', and 'fvs_weighted_trajectory.csv'
    # R2 exception: this directory is 'data/Artemis_project_fvs_copy_no_management/'
    # in the bucket, not 'data/Artemis_project_fvs_copy/' as the drive paths below.
    FVS_Data_db: "/mnt/d/Artemis_project_fvs_copy/FVS_Data.db"
    FVSOut_db: "/mnt/d/Artemis_project_fvs_copy/FVSOut.db"
    
interim:
  root:         "data/interim"

processed:
  root:         "data/processed"
