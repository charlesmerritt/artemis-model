# ARTEMIS regional LETO settings: what the `leto` stage (pipeline/leto_stage.py) runs with.
#
# One block per region. A county runs under the region whose `state_fips` its 5-digit FIPS
# starts with, so Florida, Maine and later states differ by this file, not by code
# (ADR 0004). Ground truth for every value is aauslander480/Leto `LETO_v1_project/` at the
# pin in research/leto_parity/README.md.
#
# segmentation: overrides of pipeline.leto_ca.DEFAULT_CFG. Florida has no v1 config of its
#   own, so it takes LETO's verified Maine baseline (configs/maine_test.py): edge bonus 0.2,
#   two shared edges for the similar merge, 40 iterations, 1% convergence.
# small_stands.remaining_small_stand_action: upstream's key. Upstream defaults to `retain`
#   when it is unset, so every region states it (#168).
# riparian: FCode -> [label, buffer feet] per NHD layer (pipeline.leto_riparian.BufferRules).
#   Florida's are LETO's first-pass rules (legacy 02_segment_treemap.py), plus FCode 55800
#   (artificial path) at 75 ft on flowlines: the stand-in for NHDArea river areas until
#   NHDArea is staged. The region inputs hold no NHDArea layer yet, so `area` rules are
#   kept for when it is.
# inventory.minimum_plot_weight: LETO's donor-plot filter (5%; the largest donor is kept).
# inputs: the region inputs folder region_prep writes (fia_extract.db, hydrography.gpkg),
#   relative to the repo root. `main.py leto --region-dir` overrides it.

version: 1

regions:
  florida:
    state_fips: "12"
    inputs: data/regions/fl
    segmentation:
      initial_seed_acres: 100.0
      minimum_stand_acres: 5.0
      maximum_stand_acres: 300.0
      maximum_iterations: 40
      convergence_threshold: 0.01
      shared_edge_bonus: 0.2
      similar_merge_min_shared_edges: 2
    small_stands:
      remaining_small_stand_action: force_merge
    riparian:
      flowline:
        46000: ["Unclassified Stream", 35.0]
        46003: ["Intermittent Stream", 35.0]
        46006: ["Perennial Stream", 75.0]
        46007: ["Ephemeral Stream", 0.0]
        55800: ["Artificial Path (NHDArea stand-in)", 75.0]
      waterbody:
        39000: ["Unclassified Lake/Pond", 35.0]
        39001: ["Intermittent Lake/Pond", 35.0]
        39005: ["Intermittent Lake/Pond", 35.0]
        39006: ["Intermittent Lake/Pond", 35.0]
        39004: ["Perennial Lake/Pond", 75.0]
        39009: ["Perennial Lake/Pond", 75.0]
        39010: ["Perennial Lake/Pond", 75.0]
        39011: ["Perennial Lake/Pond", 75.0]
        39012: ["Perennial Lake/Pond", 75.0]
      area:
        46000: ["Unclassified Stream/River Area", 35.0]
        46003: ["Intermittent Stream/River Area", 35.0]
        46006: ["Perennial Stream/River Area", 75.0]
        46007: ["Ephemeral Stream/River Area", 0.0]
        53700: ["Area of Complex Channels", 75.0]
    inventory:
      minimum_plot_weight: 0.05
