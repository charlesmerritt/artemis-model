# ARTEMIS owner classes — the policy layer between the ownership raster and management regimes.
#
# ONE source: Harris, Caputo & Butler (2025), "Forest ownership in the conterminous United
# States circa 2022: distribution of seven ownership types", USDA Forest Service Research
# Data Archive RDS-2025-0045, doi:10.2737/RDS-2025-0045. A 30 m raster from the National
# Woodland Owner Survey (NWOS) team, co-registered with TreeMap 2022 (config/projection.yaml).
# ARTEMIS repairs this layer in a second step; the classes below are the raster's own.
#
# Legend verified against the raster's own product metadata (US_forest_ownership.tif.xml,
# RDS-2025-0045, ArcGIS sync 2025-07-24): 0 Unknown Forest, 1 Non-Forest, 2 Water,
# 3 Family Forest, 4 Corporate/Other Private Forest, 5 Tribal Forest, 6 Federal Forest,
# 7 State Forest, 8 Local Forest. Seven ownership types (3-8) plus the unknown-forest
# residual; 1 and 2 are land cover, not owners. Pinned by tests/test_ownership_policy.py,
# which vendors the canonical legend verbatim and fails if this file drifts from it.
# Statewide Florida check (us_forest_ownership_fl_summary.json): owner classes cover
# 18.2M ac (family 7.8M, corporate 6.8M, federal 2.4M, state 1.2M, local 0.8M,
# tribal 0.05M, unknown 0.4M); non-forest 20.6M ac, water 2.6M ac, outside-product 99.6M ac.
#
# `OWN_CODE` means a Harris raster value everywhere in ARTEMIS, and the owner classes are
# exactly the Harris forest classes. Decided 2026-09-14
# (docs/architecture/presentation.html#open, decision 8).
#
#     0 unknown  1 non_forest  2 water  3 family  4 corporate  5 tribal
#     6 federal  7 state       8 local
#
# GOTCHA: a LETO stand table is only usable if its OWN_CODE came from this raster. LETO's
# packaged v1 pipeline reads it, and writes OWN_TYPE as the Harris label (Family, Corporate,
# ...). Its older cellular-automata script coded parcels instead, with the same column names
# and overlapping integers. `classify_owner` rejects a row whose OWN_TYPE does not name the
# Harris class for its OWN_CODE, and any code outside 0-8.

version: 2

# ---------------------------------------------------------------------------------------
# The owner classes
# ---------------------------------------------------------------------------------------
# `tpo_group` maps each class onto the three owner groups in config/tpo_targets.yaml,
# which is the only owner dimension the harvest scheduler's volume caps are expressed in.
# `leto_label` is how LETO v1 spells the class in OWN_TYPE.

classes:
  family:
    label: "Family forest"
    harris_values: [3]
    leto_label: "Family"
    tpo_group: "Private"
    description: >
      Individuals, families, trusts, and estates. Large in aggregate area, small per
      holding, and harvest is irregular: most family-forest acres see no entry in a
      given decade.

  corporate:
    label: "Corporate / other private forest"
    harris_values: [4]
    leto_label: "Corporate"
    tpo_group: "Private"
    description: >
      Harris's corporate class, which by the dataset's own definition includes
      not-for-profit organizations and institutions. One class, one menu: nothing in the
      raster separates a timber company from any other corporate owner.

  tribal:
    label: "Tribal forest"
    harris_values: [5]
    leto_label: "Tribal"
    tpo_group: "Private"      # FIA places Native American land in owner group 40 (private)
    description: >
      Tribal forest. Tiny sample in the five-county pilot; config/projection.yaml already
      flags that a fitted harvest model must fall back to a pooled estimate below 500
      training events. Treat any tribal-specific result as unreportable at pilot scale.

  federal:
    label: "Federal forest"
    harris_values: [6]
    leto_label: "Federal"
    tpo_group: "Federal (NF)"
    description: >
      Federal forest. In the pilot this is effectively Osceola National Forest
      (Baker and Columbia counties). The TPO group name is "Federal (NF)", so mapping
      non-NF federal land here overstates the National Forest cap — see
      `known_limitations.federal_non_nf`.

  state:
    label: "State forest"
    harris_values: [7]
    leto_label: "State"
    tpo_group: "Other public"
    description: >
      State forest and other state land, largely Florida Forest Service managed. State
      forests do sell timber, so this class is not conservation-only.

  local:
    label: "Local forest"
    harris_values: [8]
    leto_label: "Local"
    tpo_group: "Other public"
    description: >
      County and municipal forest — parks, watershed land, and school-board holdings.
      Predominantly non-commercial.

  unknown:
    label: "Unknown forest"
    harris_values: [0]
    leto_label: "Unknown"
    tpo_group: "Private"      # the dominant class by area; flagged, never silently assumed
    description: >
      Harris `unknown`: forest the raster could not attribute to an owner. Assigned
      to the private TPO group because private is the dominant owner by area in the AOI,
      but every unit resolved this way carries the `unknown_ownership` flag so its area
      can be reported separately.

# Raster values excluded from the FVS pipeline entirely.
masked_harris_values: [1, 2]      # 1 = non_forest, 2 = water
masked_leto_labels: ["NonForest", "Water"]

# One unit, one value: LETO segments stands with the raster as a hard boundary and writes
# the unit's modal Harris value to OWN_CODE. LETO v1 folds 1 and 2 into 0 before that, so
# its non-forest and water pixels arrive as `unknown` rather than masked.

# ---------------------------------------------------------------------------------------
# Known limitations — carry these into the methods writeup
# ---------------------------------------------------------------------------------------
known_limitations:
  federal_non_nf: >
    config/tpo_targets.yaml only reports a "Federal (NF)" group, so any non-National-Forest
    federal ownership in the AOI is charged against the National Forest volume cap. In the
    five-county pilot federal forest is effectively Osceola NF, so the error is small here
    and grows on expansion. Revisit when the extent leaves the pilot.
  tribal_in_private_tpo: >
    Tribal land is mapped to the "Private" TPO group to match FIA's owner grouping
    (OWNGRPCD 40). Tribal acreage in the pilot is small enough that this is immaterial,
    but the mapping is a convention, not a measurement.
  corporate_is_one_class: >
    Harris's corporate class includes not-for-profit organizations and institutions, so
    all corporate forest shares one prescription menu, rotation prescriptions included.
