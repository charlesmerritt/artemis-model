# Core projection configuration
# All pipeline components read from this file. Do not hardcode these values.

spatial:
  # ---------------------------------------------------------------------------------
  # THE PROJECT CRS. Every raster, every vector, every output. One value, stated once.
  # Read it through pipeline/spatial_ref.py — never write "EPSG:5070" into code again.
  # ---------------------------------------------------------------------------------
  crs: "EPSG:5070"
  crs_name: "NAD83 / Conus Albers"
  crs_esri_name: "NAD_1983_Contiguous_USA_Albers"   # how ArcGIS labels this same CRS
  crs_datum: "North American Datum 1983 (NAD83)"
  crs_projection: "Albers Equal Area Conic"
  crs_units: "metre"
  crs_parameters:                    # verified against pyproj, 2026-08-03
    standard_parallel_1: 29.5
    standard_parallel_2: 45.5
    latitude_of_origin: 23.0
    central_meridian: -96.0
    false_easting: 0.0
    false_northing: 0.0

  # Why this one, and not another Albers:
  #   - It is the NATIVE CRS of TreeMap 2022, LANDFIRE EVT, and the Harris ownership
  #     raster. Those three are 30 m, pixel-co-registered, and carry categorical values
  #     (plot IDs, vegetation types, ownership classes). Reprojecting them means
  #     RESAMPLING them, and nearest-neighbour resampling of a plot-ID raster changes
  #     which FIA plot a pixel inherits. Staying on 5070 makes the raster work
  #     reproject-and-snap only, with nothing resampled.
  #   - It is equal-area, so acres and hectares are computed directly from geometry.
  #
  # Confusable CRSs — all of these are wrong for ARTEMIS, and all of them fail quietly
  # rather than loudly. `pipeline/spatial_ref.py::assert_project_crs` is what catches them.
  crs_not:
    "ESRI:102008":
      name: "North_America_Albers_Equal_Area_Conic"
      why_not: >
        Same NAD83 datum, but standard parallels 20/60 and latitude of origin 40 — a
        genuinely different grid, off by kilometres. Continental fit, worse for a
        CONUS/Florida extent, and it would force a resample of every native input.
    "ESRI:102003":
      name: "USA_Contiguous_Albers_Equal_Area_Conic"
      why_not: >
        Same standard parallels as 5070 but latitude of origin 37.5, so northings differ.
        Close enough to look plausible on a map and still be wrong.
    "ESRI:102039":
      name: "USA_Contiguous_Albers_Equal_Area_Conic_USGS_version"
      why_not: >
        Numerically equivalent to EPSG:5070 (same parameters). Not an error, but use the
        EPSG code so string comparison of CRS identity keeps working.
    "EPSG:6350":
      name: "NAD83(2011) / Conus Albers"
      why_not: >
        Identical projection parameters, newer datum realization. The offset from 5070 is
        sub-metre — too small to see, large enough to break a 30 m snap grid. Mixing the
        two is a silent shift, not a visible failure.
    "EPSG:4269":
      name: "NAD83 (geographic)"
      why_not: >
        Degrees, not metres. Area and length are meaningless; every acre figure computed
        in it is wrong. This is the one that shows up by accident, because several inputs
        (NHD flowlines, NHD waterbodies) ship in it.

  resolution_m: 30                   # Target pixel size; matches TreeMap 2022 native
  snap_reference: "treemap_2022"     # All rasters snapped to this grid

  # The exact TreeMap 2022 affine, read from TreeMap2022_CONUS.tif via rasterio, in GDAL
  # order [xScale, xShear, xOrigin, yShear, yScale, yOrigin]. GEE exports pass this as
  # `crsTransform=` — never `scale=`, which lets GEE pick its own origin and silently
  # produces a half-pixel-offset grid.
  #
  # Note the origin is NOT a multiple of 30: -2361585 = -78719.5 x 30. TreeMap's grid sits
  # half a pixel off the "round" 5070 grid, so anything snapped to a round origin is
  # misaligned by 15 m. That is the failure this transform exists to prevent.
  snap_transform: [30, 0, -2361585, 0, -30, 3177435]

  chunk_strategy: "huc8"             # Chunking unit for Zarr stores and FVS batching
  # chunk_strategy alternatives: "degree_tile" (1°×1°), "state"

projection:
  horizon_years: 50
  cycle_years: 5
  n_cycles: 10                       # horizon / cycle = 10 output time steps
  base_year: 2022                    # TreeMap / ownership vintage year
  output_years: [2022, 2047, 2072]   # Year-0, Year-25, Year-50 headline rasters

fvs:
  default_variant: "SN"              # Southern variant for Florida
  # Variant assignment when expanding: keyed by state FIPS in fvs_variants.yaml
  # DISABLED 2026-07-16: carbon output is NOT trustworthy across a 5-year barrier.
  # Measured (notes/restart-fidelity-findings.md): FVS stop/restart silently resets the
  # FFE live-fuel state, collapsing Forest_Shrub_Herb to a constant 0.02 and understating
  # Total_Stand_Carbon by ~8% at every restart -- while BA/Tpa/SDI stay bit-identical, so
  # no summary-level check catches it. Stand values are exact; only carbon is affected.
  # Do NOT re-enable for iteratively coupled runs until that is resolved; see the note.
  # Continuous (unsegmented) runs are unaffected.
  carbon_extension: false
  carbon_pools:                      # All five IPCC pools -- the intended set when re-enabled
    - aboveground_live
    - belowground_live
    - dead_wood
    - forest_floor
    - soil_organic

harvest:
  forward_method: "pseudo_deterministic"
  random_seed: 42                    # Document this in versions.lock; never change post-publication
  # random_seed must be locked before any results are reported externally

ownership:
  source: "harris_2025"
  # Pixel values confirmed from US_forest_ownership.tif.xml metadata
  classes:
    0: unknown_forest
    1: non_forest                    # Mask — excluded from FVS pipeline
    2: water                         # Mask — excluded from FVS pipeline
    3: family_forest
    4: corporate_forest              # Full label: "Corporate/Other Private Forest"
    5: tribal_forest
    6: federal_forest
    7: state_forest
    8: local_forest
  mask_values: [1, 2]               # non_forest and water
  # Tribal class: fall back to pooled estimate if training sample < 500 harvest events

storage:
  zarr_compressor: "blosc"
  zarr_clevel: 5
  parquet_compression: "zstd"
  parquet_row_group_size: 100000
