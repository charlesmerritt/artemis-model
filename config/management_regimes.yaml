# Management regimes by ownership class — the unified direction
#
# Single source of truth for "which silvicultural regime does each owner class get?".
# See notes/management-regimes-by-owner.md for the reasoning and open questions.
#
# ############################ VOCABULARY WARNING ############################
# There are TWO ownership code systems in this project and they use the SAME
# column name (`OWN_CODE`) with COMPLETELY DIFFERENT meanings:
#
#   LETO OWN_CODE (this file's primary key, from FVS_StandInit.csv):
#       0 Unknown  1 Private  2 Corporate  3 Federal  4 State  5 County  6 NGO  7 Other
#   Harris RDS-2025-0045 raster value (config/projection.yaml: ownership.classes):
#       0 unknown  1 non_forest  2 water  3 family  4 corporate  5 tribal
#       6 federal  7 state  8 local
#
# Every shared integer means something different. LETO 3 is Federal; Harris 3 is
# Family. LETO 4 is State; Harris 4 is Corporate. Mixing them silently assigns the
# wrong regime to every stand — see GitHub issue #20 and the `harris_*` fields below,
# which exist so a consumer can always tell which system a value came from.
# ############################################################################

version: 2

sources:
  # PRIMARY: the ownership vocabulary the FVS inputs actually carry.
  leto_stand_init:
    path: "r2://artemis-r2/data/20260804_095846_Hard_Ownership_Boundaries/Inputs/FVS_StandInit.csv"
    run: "LETO FVS DATABASE RUN — Hard_Ownership_Boundaries, 2026-08-04 09:58"
    fields: "OWN_CODE, OWN_TYPE (owner axis); MGMT_CLASS, MGMT_TYPE (management axis); DB_GROUP"
    totals: "57,527 stands; 1,052,305.90 acres; 9,199,539 tree records; variant SN; FIPS 12; inv year 2022"
  # SECONDARY: the 30 m raster. Different vocabulary — crosswalked, never substituted.
  ownership_raster: "Harris, Caputo & Butler (2025), doi:10.2737/RDS-2025-0045 — 30 m, circa 2022"
  ownership_classes: "config/projection.yaml: ownership.classes"
  # Finer parcel taxonomy upstream of LETO's OWN_TYPE (REIT / TIMO / Company split out).
  parcel_summary: "r2://artemis-r2/data/Owner_Summaries_FL5Co_Parcels.txt"
  regime_library: "pipeline/s4_fvs/regime_templates.py: REGIMES"
  assignment_code: "pipeline/s3_management/regime_assignment.py: assign_regime"
  volume_caps: "config/tpo_targets.yaml: by_owner_group"
  buffer_rules: "config/bmp_rules.yaml"

# Year-valued params below are OFFSETS from the inventory year
# (config/projection.yaml: projection.base_year, 2022). A `*_offset` key of 10 means
# the absolute FVS keyword year is inv_year + 10 = 2032.
inventory_year_source: "config/projection.yaml: projection.base_year"

# ---------------------------------------------------------------------------------
# Precedence — evaluated top to bottom, first match wins.
#
# LETO carries ownership and management as two independent columns, which is exactly
# this ladder: MGMT_CLASS/MGMT_TYPE (geometry) is orthogonal to OWN_CODE/OWN_TYPE
# (owner). The 9 FVS DB_GROUPs flatten the two axes into one grouping key for database
# splitting; that flattening is a run-packaging convenience and must not be read as
# "Riparian is an ownership class".
# ---------------------------------------------------------------------------------
precedence:
  - rank: 1
    rule: riparian_override
    keyed_by: management_class
    detail: >-
      MGMT_CLASS == 1 (MGMT_TYPE "Riparian") gets `no_management` unconditionally — no
      entry of any kind, no buffer class exempted, no ownership able to override it.
      Still grown and reported as its own polygon. notes/methodology-directions.md item 2.
  - rank: 2
    rule: owner_class_default
    keyed_by: leto_own_type
    detail: "The per-class `default` block below."
  - rank: 3
    rule: forest_type_split
    keyed_by: forest_type_group
    detail: >-
      Only inside a class that declares `default.by_forest_type` (corporate today).
      Pine test is FORTYPCD 140-179 per regime_assignment.is_pine.

riparian_override:
  regime: no_management
  params: {}
  # PRIMARY test — the LETO management axis.
  mgmt_class_value: 1
  mgmt_type_value: "Riparian"
  # FALLBACK test for units that predate LETO segmentation and carry only a percentage.
  smz_pct_threshold: 50.0
  applies_to: all_owner_classes
  observed:
    stands: 17703
    acres: 26485.31
    mean_stand_acres: 1.50
    note: >-
      Riparian stands are slivers — 1.50 ac mean against 25.76 ac for upland. 17,703 of
      57,527 stands (31%) carry 2.5% of the acreage. That is a delineation artifact worth
      watching (see pipeline/s3_management/sliver_merge.py), not a modelling decision, and
      it must not be resolved by dissolving buffers into neighbours.

# ---------------------------------------------------------------------------------
# Regime library — mechanical templates, plus the PLAN.md 4b policy name each implements.
# ---------------------------------------------------------------------------------
regimes:
  no_management:
    policy_name: "No management / Riparian"
    cuts: false
  thin_from_below:
    policy_name: "NIPF light"
    cuts: true
  selection_harvest:
    policy_name: "Public conservative management"
    cuts: true
  plantation_rotation:
    policy_name: "Industrial pine plantation"
    cuts: true
  clearcut:
    policy_name: "Industrial hardwood / mixed"
    cuts: true

# ---------------------------------------------------------------------------------
# Owner classes — keyed by LETO OWN_TYPE, the vocabulary the FVS inputs carry.
#
# `observed` counts are upland stands/acres from the 2026-08-04 LETO run (riparian
# stands are excluded because rank-1 precedence takes them before ownership applies).
#
# `harris_class` / `harris_raster_value` give the Harris equivalent where one exists,
# and are explicitly null where it does not. NEVER assume leto_own_code and
# harris_raster_value are interchangeable — they are not.
#
# `assignment_status`:
#   current  — regime_assignment.py produces this regime today (via the Harris code).
#   proposed — the direction differs from code; `supersedes` names what code does now.
# ---------------------------------------------------------------------------------
owner_classes:

  unknown:
    leto_own_code: 0
    leto_own_type: "Unknown"
    harris_class: unknown_forest
    harris_raster_value: 0
    label: "Forested, ownership unresolved"
    observed: {upland_stands: 218, upland_acres: 2122.05}
    tpo_owner_group: null          # deliberately uncapped
    lamps_mha_group: null          # not schedulable
    assignment_status: current
    default:
      regime: thin_from_below
      params: {year_offset: 10, max_dbh: 8.0, proportion: 0.35}
    eligible_regimes: [no_management, thin_from_below]
    differentiation: >-
      Not a real owner. Resolve the stands rather than tune the regime. Note 429 of the
      647 Unknown stands are riparian and never reach an ownership rule at all.
    reporting: >-
      Report as its own row, never folded into Private.

  private:
    leto_own_code: 1
    leto_own_type: "Private"
    harris_class: family_forest
    harris_raster_value: 3
    label: "Private / family forest (NIPF)"
    observed: {upland_stands: 11567, upland_acres: 269312.28}
    tpo_owner_group: "Private"
    lamps_mha_group: null          # LAMPS maps industrial+public only; family raises
    assignment_status: current
    default:
      regime: thin_from_below
      params: {year_offset: 10, max_dbh: 8.0, proportion: 0.35}
    eligible_regimes: [no_management, thin_from_below, selection_harvest, clearcut]
    differentiation: >-
      Largest class by upland acreage (269,312 ac, 26%). Harvest is episodic and
      owner-driven rather than rotation-driven; a single deterministic thin is a
      placeholder for the fitted harvest model (PLAN.md 3c).
    open:
      - "No LAMPS minimum-harvest-age group. Scheduler must degrade to schedulable=false
         rather than crash — LAMPS integration plan, Task 4."

  corporate:
    leto_own_code: 2
    leto_own_type: "Corporate"
    harris_class: corporate_forest
    harris_raster_value: 4
    label: "Corporate forest (REIT / TIMO / operating company)"
    observed: {upland_stands: 5709, upland_acres: 212814.42}
    tpo_owner_group: "Private"
    lamps_mha_group: "industrial"
    assignment_status: current
    default:
      by_forest_type:
        pine:
          regime: plantation_rotation
          params:
            thin_year_offset: 15
            thin_proportion: 0.40
            thin_max_dbh: 8.0
            clearcut_year_offset: 30
        other:
          regime: clearcut
          params: {year_offset: 30}
      forest_type_test: "pipeline.s3_management.regime_assignment.is_pine (FORTYPCD 140-179)"
    eligible_regimes: [thin_from_below, plantation_rotation, clearcut]
    differentiation: >-
      The one class whose management is genuinely rotation-driven, so a fixed schedule is
      defensible here in a way it is not elsewhere. 30-year rotation is the Southeast
      loblolly convention, not a fitted value.
    open:
      - "LETO collapses REIT, TIMO, and operating company into one class. The parcel
         summary keeps them apart (Forest-REIT 179,723 ac; Forest-TIMO 45,848 ac;
         Forest-Company 45,235 ac) and they do not manage alike — REIT/TIMO are the most
         rotation-driven owners in the AOI. Splitting this class is the highest-value
         refinement available, and the data to do it already exists upstream."
      - "plantation_rotation emits no PLANT/NATREGEN keyword — issue #18."

  federal:
    leto_own_code: 3
    leto_own_type: "Federal"
    harris_class: federal_forest
    harris_raster_value: 6
    label: "Federal forest (National Forest and other federal)"
    observed: {upland_stands: 4534, upland_acres: 213545.57}
    tpo_owner_group: "Federal (NF)"
    lamps_mha_group: "public"
    assignment_status: current
    default:
      regime: selection_harvest
      params: {start_year_offset: 10, end_year_offset: 40, interval: 10, proportion: 0.20}
    eligible_regimes: [no_management, selection_harvest, thin_from_below]
    differentiation: >-
      The only class with its own TPO cap (1.77M cuft/yr all-years, 2.02M for 2013-2024),
      so it is separable on the constraint side even while its regime parameters match
      the other public classes.
    open:
      - "The TPO 'Federal (NF)' cap is National Forest only; other federal ownership in
         this class has no cap of its own and would consume the NF budget."

  state:
    leto_own_code: 4
    leto_own_type: "State"
    harris_class: state_forest
    harris_raster_value: 7
    label: "State forest"
    observed: {upland_stands: 1958, upland_acres: 74397.91}
    tpo_owner_group: "Other public"
    lamps_mha_group: "public"
    assignment_status: current
    default:
      regime: selection_harvest
      params: {start_year_offset: 10, end_year_offset: 40, interval: 10, proportion: 0.20}
    eligible_regimes: [no_management, selection_harvest, thin_from_below, plantation_rotation]
    differentiation: >-
      Florida state forests are managed more actively than the federal parameters imply
      (longleaf restoration, thinning for RCW habitat, some pine production). Diverging
      needs evidence: LCMS Tree Removal rate on state versus federal stands over the AOI.
      Until then the shared parameters stand and plantation_rotation stays eligible but
      unused.

  county:
    leto_own_code: 5
    leto_own_type: "County"
    harris_class: local_forest
    harris_raster_value: 8
    label: "County / municipal forest"
    observed: {upland_stands: 278, upland_acres: 3874.83}
    tpo_owner_group: "Other public"
    lamps_mha_group: "public"
    assignment_status: current
    default:
      regime: selection_harvest
      params: {start_year_offset: 10, end_year_offset: 40, interval: 10, proportion: 0.20}
    eligible_regimes: [no_management, selection_harvest]
    differentiation: >-
      Smallest class (3,875 upland ac, 0.4%), largely parks and watershed land where
      commercial entry is rare. Testable criterion: if these stands show a Tree Removal
      rate near zero in LCMS 1985-2024, the default becomes no_management rather than a
      20% selection cut every decade. Applying the public schedule here is the most
      likely over-harvest in this table, though the acreage bounds the damage.

  ngo:
    leto_own_code: 6
    leto_own_type: "NGO"
    harris_class: null             # Harris has no NGO class — folded into family/corporate
    harris_raster_value: null
    label: "NGO / land trust forest"
    observed: {upland_stands: 370, upland_acres: 15508.35}
    tpo_owner_group: "Private"     # FIA treats NGO as private ownership
    lamps_mha_group: "public"      # conservation behaviour, not industrial
    assignment_status: proposed
    supersedes:
      # Harris cannot express NGO, so today these stands land in whatever Harris class
      # the raster gives them — usually family (3) or corporate (4). Code has no NGO branch.
      regime: thin_from_below
      params: {year_offset: 10, max_dbh: 8.0, proportion: 0.35}
    default:
      regime: selection_harvest
      params: {start_year_offset: 10, end_year_offset: 40, interval: 10, proportion: 0.20}
    eligible_regimes: [no_management, selection_harvest, thin_from_below]
    differentiation: >-
      A class the Harris raster cannot express at all — this is the clearest single reason
      to key regimes off LETO rather than the raster. Conservation NGOs and land trusts
      (TNC and similar in this AOI) manage for restoration and habitat, not yield, so the
      public conservative schedule is a closer fit than the private light thin they
      currently receive by accident.
    open:
      - "no_management may be the better default for easement-encumbered NGO land.
         Needs the easement layer, which the pipeline does not have."

  other:
    leto_own_code: 7
    leto_own_type: "Other"
    harris_class: null             # no clean Harris equivalent
    harris_raster_value: null
    label: "Other / unclassified ownership"
    observed: {upland_stands: 15190, upland_acres: 234245.19}
    tpo_owner_group: null          # uncapped pending decomposition — see below
    lamps_mha_group: null          # not schedulable until decomposed
    assignment_status: proposed
    supersedes:
      regime: thin_from_below
      params: {year_offset: 10, max_dbh: 8.0, proportion: 0.35}
    default:
      regime: thin_from_below
      params: {year_offset: 10, max_dbh: 8.0, proportion: 0.35}
    eligible_regimes: [no_management, thin_from_below]
    differentiation: >-
      THE BIGGEST OPEN PROBLEM IN THIS FILE. 15,190 upland stands and 234,245 acres — 22%
      of upland acreage and the second-largest class — sitting in a bucket with no owner
      semantics at all. Every harvest total this pipeline produces is sensitive to what
      "Other" turns out to be, and the light-thin default is a holding position chosen to
      keep the class from dominating a total, not a claim about how the land is managed.
    open:
      - "Decompose it. The parcel summary shows the likely constituents — Other-Misc
         (702,605 parcel ac, 7.99 ac mean, 1.61 ac median), Other-State, Other-Private,
         Other-County, Other-Federal — which suggests 'Other' is mostly small non-industrial
         parcels plus the non-forest-classified holdings of owners already named above.
         If most of it is really Private, it belongs in that class and under the Private cap."
      - "Uncapped until decomposed. Assigning it to a TPO group before knowing what it is
         would silently move ~22% of the landscape under someone else's volume ceiling."

# Harris classes with no LETO counterpart in this AOI. Kept visible so the crosswalk is
# demonstrably total in both directions rather than quietly lossy.
harris_classes_absent_from_leto:
  tribal_forest:
    harris_raster_value: 5
    note: >-
      No tribal ownership appears in the 5-county AOI's LETO run. projection.yaml's
      "fall back to pooled estimate if training sample < 500 harvest events" still applies
      when the pipeline expands beyond Florida.
  non_forest:
    harris_raster_value: 1
    note: "Masked from the pipeline (projection.yaml: ownership.mask_values)."
  water:
    harris_raster_value: 2
    note: "Masked from the pipeline (projection.yaml: ownership.mask_values)."

# ---------------------------------------------------------------------------------
# Crosswalks.
# ---------------------------------------------------------------------------------
crosswalks:

  # LETO owner class -> TPO owner group. Names must match config/tpo_targets.yaml
  # by_owner_group keys exactly; the scheduler's OWNER dimension looks up caps by these.
  tpo_owner_group:
    "Federal (NF)": [federal]
    "Other public": [state, county]
    "Private": [private, corporate, ngo]
    _uncapped: [unknown, other]

  # LETO owner class -> LAMPS minimum-harvest-age group. `_unmapped` classes have no MHA
  # by design: LAMPS refuses to invent one, so the scheduler marks those units
  # schedulable=false rather than crashing.
  lamps_mha_group:
    industrial: [corporate]
    public: [federal, state, county, ngo]
    _unmapped: [private, unknown, other]

  # LETO OWN_CODE -> Harris raster value. THE INTEGERS DO NOT MATCH. This mapping is the
  # only safe way to move between the two systems.
  leto_own_code_to_harris_raster_value:
    0: 0      # Unknown   -> unknown_forest
    1: 3      # Private   -> family_forest
    2: 4      # Corporate -> corporate_forest
    3: 6      # Federal   -> federal_forest
    4: 7      # State     -> state_forest
    5: 8      # County    -> local_forest
    6: null   # NGO       -> no Harris equivalent
    7: null   # Other     -> no Harris equivalent

  # The 9 FVS database groups from the LETO run. This is a RUN-PACKAGING key, not an
  # ownership vocabulary: it equals OWN_TYPE for upland stands and "Riparian" for every
  # riparian stand regardless of owner. Do not assign regimes off this field.
  fvs_db_group:
    derivation: "OWN_TYPE where MGMT_CLASS == 0; 'Riparian' where MGMT_CLASS == 1"
    groups: [Corporate, County, Federal, NGO, Other, Private, Riparian, State, Unknown]

# ---------------------------------------------------------------------------------
# Trajectory-library cost. FVS run count is unique(plot x regime x site-index bin)
# (PLAN.md 4c). Distinct parameterizations across every eligible set above:
#   no_management, thin_from_below, selection_harvest, plantation_rotation, clearcut = 5.
# The LETO run resolves 57,527 stands from 529 retained unique PLT_CN donors, so the
# library is keyed on those donors, not on stand count.
# ---------------------------------------------------------------------------------
trajectory_library:
  distinct_parameterizations: 5
  leto_unique_donor_plots: 529
  leto_stands: 57527
  pilot_upper_bound_runs: 2645   # 529 donors x 5 regimes
  si_binning: "inherited from donor plot; no multiplier until per-pixel SI regression lands (PLAN.md 2d)"
