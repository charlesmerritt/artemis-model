[project]
name = "eastern-us-forest-projection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.61",
    "duckdb>=1.5.4",
    "earthengine-api>=1.7.26",
    "folium>=0.12",
    "geemap>=0.37.3",
    "geopandas>=1.1.3",
    "ipyleaflet>=0.20.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab-widgets>=3.0.16",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyogrio>=0.12.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "xlrd>=2.0.2",
]

[tool.pytest.ini_options]
markers = [
    "arcpy: optional parity tests requiring an ArcGIS Pro Python environment",
    "production_data: integration tests requiring the mounted production sources",
]
testpaths = ["tests", "pipeline", "scripts/quality.py"]
pythonpath = ["."]
addopts = ["--doctest-modules", "--import-mode=importlib"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]

[dependency-groups]
dev = [
    "crap4py>=0.1.1",
    "mutmut>=3.8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py314"
# Notebook cells legitimately import mid-file and use semicolons (E402/E702);
# linting them reports ~20 errors that are normal notebook style, not defects.
extend-exclude = ["notebooks", "data", ".jupyter-runtime"]

# Rules are ruff's defaults (E4/E7/E9 + F): correctness and unused code, no
# style opinions. Deliberately not enabling isort/formatting rules, which would
# churn the whole repo without catching bugs.

[tool.mutmut]
# Mutation testing runs file by file (`scripts/quality.py mutate` selects the file); this is the base.
source_paths = ["pipeline"]
also_copy = ["config", "scripts", "tests"]
pytest_add_cli_args_test_selection = ["tests", "pipeline"]
mutate_only_covered_lines = true
